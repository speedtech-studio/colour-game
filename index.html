<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Colour Sequence Game</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#eef1f5;
  color:#222;
  touch-action:none;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

.game{
  width:100vw;
  height:100vh;
  max-width:1600px;
  max-height:900px;
  aspect-ratio:16/9;
  background:#fff;
  position:relative;
  overflow:hidden;
}

.screen{
  display:none;
  width:100%;
  height:100%;
  padding:28px 36px;
}

.screen.active{display:flex}

.play-layout{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:1.05fr 1.15fr .9fr;
  grid-template-rows:auto 1fr auto;
  gap:22px;
}

.header{
  grid-column:1 / 4;
}

h1{
  margin:0;
  font-size:34px;
}

.subtitle{
  margin:6px 0 0;
  color:#666;
  font-size:17px;
}

.card-panel,
.answer-panel,
.palette-panel{
  border-radius:24px;
  padding:22px;
}

.card-panel{
  background:#fff9e9;
  border:3px solid #222;
}

.answer-panel{
  background:#f6f8fb;
}

.palette-panel{
  background:#f2f4f7;
}

.panel-title{
  font-size:21px;
  font-weight:700;
  margin-bottom:18px;
}

.sequence,
.targets,
.palette{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
}

.sequence{
  margin-top:20px;
}

.dot{
  width:68px;
  height:68px;
  border-radius:50%;
  border:4px solid rgba(0,0,0,.10);
  box-shadow:0 6px 12px rgba(0,0,0,.08);
}

.slot{
  width:78px;
  height:78px;
  border-radius:50%;
  border:4px dashed #bfc4cc;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
}

.slot .dot{
  width:66px;
  height:66px;
}

.piece{
  width:78px;
  height:78px;
  border-radius:50%;
  border:4px solid rgba(0,0,0,.1);
  box-shadow:0 8px 16px rgba(0,0,0,.13);
  cursor:grab;
  touch-action:none;
  user-select:none;
}

.piece:active{
  transform:scale(1.05);
}

.bottom{
  grid-column:1 / 4;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}

.status{
  height:26px;
  font-weight:700;
  font-size:18px;
}

.controls{
  display:flex;
  gap:12px;
}

button{
  border:none;
  border-radius:15px;
  padding:13px 20px;
  font-size:17px;
  cursor:pointer;
  background:#222;
  color:#fff;
}

button.secondary{
  background:#eceff3;
  color:#222;
}

.reward,
.tryagain{
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

.reward .big,
.tryagain .big{
  font-size:76px;
}

.reward h2,
.tryagain h2{
  margin:12px 0 6px;
  font-size:42px;
}

.reward p,
.tryagain p{
  margin:0 0 18px;
  font-size:20px;
  color:#666;
}

.stars{
  font-size:44px;
  margin:8px 0 24px;
}

.dragging{
  position:fixed !important;
  z-index:999;
  pointer-events:none;
  transform:scale(1.08);
}

.confetti{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.confetti span{
  position:absolute;
  top:-20px;
  width:14px;
  height:22px;
  border-radius:4px;
  animation:fall 2.5s linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(100vh) rotate(720deg);
    opacity:.2;
  }
}

@media(max-width:900px){
  .screen{padding:18px}
  .play-layout{gap:12px}
  h1{font-size:28px}
  .subtitle{font-size:14px}
  .card-panel,.answer-panel,.palette-panel{padding:15px}
  .panel-title{font-size:17px}
  .dot{width:52px;height:52px}
  .slot{width:62px;height:62px}
  .slot .dot{width:50px;height:50px}
  .piece{width:62px;height:62px}
  button{padding:10px 14px;font-size:14px}
}
</style>
</head>

<body>

<div class="game">

<div id="playScreen" class="screen active">

<div class="play-layout">

<div class="header">
<h1>Arrange the Colours</h1>
<p class="subtitle">
Look at the instruction card and arrange the colours in the same order.
</p>
</div>

<div class="card-panel">
<div class="panel-title">Instruction Card</div>
<div id="sequence" class="sequence"></div>
</div>

<div class="answer-panel">
<div class="panel-title">Arrange Here</div>
<div id="targets" class="targets"></div>
</div>

<div class="palette-panel">
<div class="panel-title">Drag the Colours</div>
<div id="palette" class="palette"></div>
</div>

<div class="bottom">
<div id="status" class="status"></div>

<div class="controls">
<button id="checkBtn">Check Answer</button>
<button id="newBtn" class="secondary">New Card</button>
<button id="resetBtn" class="secondary">Reset</button>
</div>
</div>

</div>
</div>


<div id="rewardScreen" class="screen reward">

<div class="big">🎉</div>

<h2>Great Job!</h2>

<p>You arranged the colours correctly.</p>

<div class="stars">⭐ ⭐ ⭐</div>

<button id="nextBtn">Next Challenge</button>

</div>


<div id="tryScreen" class="screen tryagain">

<div class="big">💪</div>

<h2>Try Again</h2>

<p>Check the colour order and try once more.</p>

<button id="tryBtn">Try Again</button>

</div>

<div id="confetti" class="confetti"></div>

</div>


<script>

const COLORS={
red:{hex:"#ef4444",label:"Red"},
blue:{hex:"#3b82f6",label:"Blue"},
yellow:{hex:"#facc15",label:"Yellow"},
green:{hex:"#22c55e",label:"Green"}
};

const colorKeys=Object.keys(COLORS);

let targetSequence=[];
let answers=[null,null,null,null];
let wrongChecks=0;

const playScreen=document.getElementById("playScreen");
const rewardScreen=document.getElementById("rewardScreen");
const tryScreen=document.getElementById("tryScreen");

const sequenceEl=document.getElementById("sequence");
const targetsEl=document.getElementById("targets");
const paletteEl=document.getElementById("palette");
const statusEl=document.getElementById("status");
const confettiEl=document.getElementById("confetti");


function shuffle(arr){
return [...arr].sort(()=>Math.random()-.5);
}


function showScreen(screen){

[playScreen,rewardScreen,tryScreen]
.forEach(s=>s.classList.remove("active"));

screen.classList.add("active");

}


function newChallenge(){

targetSequence=shuffle(colorKeys);

answers=[null,null,null,null];

wrongChecks=0;

statusEl.textContent="";

showScreen(playScreen);

render();

}


function render(){

sequenceEl.innerHTML="";

targetSequence.forEach(color=>{

const dot=document.createElement("div");

dot.className="dot";

dot.style.background=COLORS[color].hex;

sequenceEl.appendChild(dot);

});


targetsEl.innerHTML="";

answers.forEach((value,index)=>{

const slot=document.createElement("div");

slot.className="slot";

slot.dataset.index=index;

if(value){

const dot=document.createElement("div");

dot.className="dot";

dot.style.background=COLORS[value].hex;

slot.appendChild(dot);

}

targetsEl.appendChild(slot);

});


paletteEl.innerHTML="";

colorKeys.forEach(color=>{

const piece=document.createElement("div");

piece.className="piece";

piece.style.background=COLORS[color].hex;

piece.dataset.color=color;

attachDrag(piece);

paletteEl.appendChild(piece);

});

}


function speakColor(color){

if(!("speechSynthesis" in window)) return;

speechSynthesis.cancel();

const speech=new SpeechSynthesisUtterance(
COLORS[color].label
);

speech.rate=.85;

speechSynthesis.speak(speech);

}


function beep(correct=true){

try{

const AudioCtx=
window.AudioContext||
window.webkitAudioContext;

const ctx=new AudioCtx();

const osc=ctx.createOscillator();

const gain=ctx.createGain();

osc.connect(gain);

gain.connect(ctx.destination);

osc.frequency.value=
correct?720:220;

gain.gain.value=.08;

osc.start();

osc.stop(
ctx.currentTime+.18
);

}catch(e){}

}


function attachDrag(element){

let ghost=null;


function start(event){

event.preventDefault();

const color=element.dataset.color;

speakColor(color);


const point=
event.touches
?event.touches[0]
:event;


ghost=element.cloneNode(true);

ghost.classList.add("dragging");

ghost.style.width=
element.offsetWidth+"px";

ghost.style.height=
element.offsetHeight+"px";

document.body.appendChild(ghost);

moveGhost(
point.clientX,
point.clientY
);


function move(ev){

const p=
ev.touches
?ev.touches[0]
:ev;

moveGhost(
p.clientX,
p.clientY
);

}


function end(ev){

const p=
ev.changedTouches
?ev.changedTouches[0]
:ev;

const x=p.clientX;
const y=p.clientY;

if(ghost) ghost.remove();

ghost=null;


const below=
document.elementFromPoint(x,y);

const slot=
below
?below.closest(".slot")
:null;


if(slot){

const index=
Number(
slot.dataset.index
);

answers[index]=color;

render();

beep(true);

}


window.removeEventListener(
"mousemove",move
);

window.removeEventListener(
"mouseup",end
);

window.removeEventListener(
"touchmove",move
);

window.removeEventListener(
"touchend",end
);

}


window.addEventListener(
"mousemove",move,
{passive:false}
);

window.addEventListener(
"mouseup",end,
{passive:false}
);

window.addEventListener(
"touchmove",move,
{passive:false}
);

window.addEventListener(
"touchend",end,
{passive:false}
);

}


element.addEventListener(
"mousedown",start
);

element.addEventListener(
"touchstart",start,
{passive:false}
);


function moveGhost(x,y){

if(!ghost)return;

ghost.style.left=
(x-ghost.offsetWidth/2)+"px";

ghost.style.top=
(y-ghost.offsetHeight/2)+"px";

}

}


function checkAnswer(){

if(
answers.some(v=>!v)
){

statusEl.textContent=
"Fill all the circles first.";

beep(false);

return;

}


const correct=
answers.every(
(v,i)=>
v===targetSequence[i]
);


if(correct){

beep(true);

showScreen(rewardScreen);

celebrate();

}

else{

wrongChecks++;

beep(false);


if(wrongChecks>=2){

showScreen(tryScreen);

}

else{

statusEl.textContent=
"Almost! Check the order and try again.";

}

}

}


function celebrate(){

confettiEl.innerHTML="";

const colours=[
"#ef4444",
"#3b82f6",
"#facc15",
"#22c55e",
"#a855f7",
"#fb7185"
];


for(let i=0;i<50;i++){

const item=
document.createElement("span");

item.style.left=
Math.random()*100+"%";

item.style.background=
colours[
Math.floor(
Math.random()*colours.length
)
];

item.style.animationDelay=
Math.random()*.8+"s";

confettiEl.appendChild(item);

}


setTimeout(
()=>confettiEl.innerHTML="",
3000
);

}


document
.getElementById("checkBtn")
.addEventListener(
"click",
checkAnswer
);


document
.getElementById("newBtn")
.addEventListener(
"click",
newChallenge
);


document
.getElementById("resetBtn")
.addEventListener(
"click",
()=>{

answers=
[null,null,null,null];

statusEl.textContent="";

render();

}
);


document
.getElementById("nextBtn")
.addEventListener(
"click",
newChallenge
);


document
.getElementById("tryBtn")
.addEventListener(
"click",
()=>{

answers=
[null,null,null,null];

wrongChecks=0;

statusEl.textContent="";

showScreen(playScreen);

render();

}
);


newChallenge();

</script>

</body>
</html>
