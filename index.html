<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Colour Sequence Game</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial, Helvetica, sans-serif;
  background:#f7f8fb;
  color:#222;
  touch-action:none;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.game{
  width:min(980px,100%);
  min-height:620px;
  background:#fff;
  border-radius:28px;
  box-shadow:0 14px 50px rgba(0,0,0,.12);
  overflow:hidden;
  position:relative;
}

.screen{
  display:none;
  min-height:620px;
  padding:28px;
}

.screen.active{
  display:block;
}

h1{
  margin:0 0 8px;
  font-size:34px;
}

.subtitle{
  margin:0 0 22px;
  color:#666;
  font-size:18px;
}

.instruction-card{
  border:3px solid #222;
  border-radius:22px;
  padding:18px;
  background:#fffef8;
  margin-bottom:24px;
}

.instruction-card h2{
  margin:0 0 12px;
  font-size:24px;
}

.sequence{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  align-items:center;
}

.dot{
  width:72px;
  height:72px;
  border-radius:50%;
  border:4px solid rgba(0,0,0,.1);
}

.targets{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  margin:18px 0 28px;
}

.slot{
  width:84px;
  height:84px;
  border-radius:50%;
  border:4px dashed #c7cad1;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
}

.slot.filled{
  border-style:solid;
  border-color:#d8dbe2;
}

.palette{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:#f4f6fa;
  border-radius:22px;
}

.piece{
  width:86px;
  height:86px;
  border-radius:50%;
  border:4px solid rgba(0,0,0,.1);
  box-shadow:0 8px 18px rgba(0,0,0,.12);
  cursor:grab;
  touch-action:none;
  user-select:none;
}

.controls{
  display:flex;
  gap:12px;
  justify-content:center;
  margin-top:22px;
  flex-wrap:wrap;
}

button{
  border:none;
  border-radius:16px;
  padding:14px 20px;
  font-size:18px;
  cursor:pointer;
  background:#222;
  color:#fff;
}

button.secondary{
  background:#eef0f4;
  color:#222;
}

.status{
  min-height:28px;
  text-align:center;
  font-weight:700;
  font-size:20px;
  margin-top:14px;
}

.reward,
.tryagain{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.reward .big,
.tryagain .big{
  font-size:80px;
  margin-bottom:10px;
}

.reward h2,
.tryagain h2{
  font-size:38px;
  margin:0 0 10px;
}

.reward p,
.tryagain p{
  font-size:20px;
  color:#666;
  margin:0 0 24px;
}

.stars{
  font-size:48px;
  letter-spacing:8px;
  margin:12px 0 26px;
}

.confetti{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.confetti span{
  position:absolute;
  top:-20px;
  width:14px;
  height:22px;
  border-radius:4px;
  animation:fall 2.6s linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(720px) rotate(720deg);
    opacity:.2;
  }
}

.dragging{
  position:fixed !important;
  z-index:999;
  pointer-events:none;
  transform:scale(1.08);
}

@media (max-width:700px){
  body{
    padding:0;
  }

  .game{
    min-height:100vh;
    border-radius:0;
  }

  .screen{
    min-height:100vh;
    padding:18px;
  }

  h1{
    font-size:28px;
  }

  .dot{
    width:58px;
    height:58px;
  }

  .slot{
    width:68px;
    height:68px;
  }

  .piece{
    width:72px;
    height:72px;
  }
}
</style>
</head>

<body>

<div class="game">

<div id="playScreen" class="screen active">

<h1>Arrange the Colours</h1>

<p class="subtitle">
Look at the card. Drag the colours into the circles in the same order.
</p>

<div class="instruction-card">

<h2>Instruction Card</h2>

<div id="sequence" class="sequence"></div>

</div>

<div id="targets" class="targets"></div>

<div class="palette" id="palette"></div>

<div class="status" id="status"></div>

<div class="controls">

<button id="checkBtn">
Check Answer
</button>

<button id="newBtn" class="secondary">
New Card
</button>

<button id="resetBtn" class="secondary">
Reset
</button>

</div>

</div>


<div id="rewardScreen" class="screen reward">

<div class="big">
🎉
</div>

<h2>
Great Job!
</h2>

<p>
You arranged the colours correctly.
</p>

<div class="stars">
⭐ ⭐ ⭐
</div>

<button id="nextBtn">
Next Challenge
</button>

</div>


<div id="tryScreen" class="screen tryagain">

<div class="big">
💪
</div>

<h2>
Try Again
</h2>

<p>
That order is not quite right yet.
</p>

<button id="tryBtn">
Try Again
</button>

</div>


<div id="confetti" class="confetti"></div>

</div>


<script>

const COLORS = {

red:{
hex:"#ef4444",
label:"Red"
},

blue:{
hex:"#3b82f6",
label:"Blue"
},

yellow:{
hex:"#facc15",
label:"Yellow"
},

green:{
hex:"#22c55e",
label:"Green"
}

};


const colorKeys =
Object.keys(COLORS);


let targetSequence = [];

let answers =
[null,null,null,null];

let wrongChecks = 0;


const playScreen =
document.getElementById("playScreen");

const rewardScreen =
document.getElementById("rewardScreen");

const tryScreen =
document.getElementById("tryScreen");

const sequenceEl =
document.getElementById("sequence");

const targetsEl =
document.getElementById("targets");

const paletteEl =
document.getElementById("palette");

const statusEl =
document.getElementById("status");

const confettiEl =
document.getElementById("confetti");


function shuffle(arr){

return [...arr]
.sort(()=>Math.random()-0.5);

}


function newChallenge(){

targetSequence =
shuffle(colorKeys);

answers =
[null,null,null,null];

wrongChecks = 0;

statusEl.textContent = "";

showScreen(playScreen);

render();

}


function render(){

sequenceEl.innerHTML = "";

targetSequence.forEach(color=>{

const dot =
document.createElement("div");

dot.className = "dot";

dot.style.background =
COLORS[color].hex;

sequenceEl.appendChild(dot);

});


targetsEl.innerHTML = "";

answers.forEach((value,index)=>{

const slot =
document.createElement("div");

slot.className =
"slot" + (value ? " filled" : "");

slot.dataset.index = index;

if(value){

const dot =
document.createElement("div");

dot.className = "dot";

dot.style.width = "68px";
dot.style.height = "68px";

dot.style.background =
COLORS[value].hex;

slot.appendChild(dot);

}

targetsEl.appendChild(slot);

});


paletteEl.innerHTML = "";

colorKeys.forEach(color=>{

const piece =
document.createElement("div");

piece.className = "piece";

piece.style.background =
COLORS[color].hex;

piece.dataset.color =
color;

attachDrag(piece);

paletteEl.appendChild(piece);

});

}


function showScreen(screen){

[
playScreen,
rewardScreen,
tryScreen
]
.forEach(s=>
s.classList.remove("active")
);

screen.classList.add("active");

}


function speakColor(color){

if(!("speechSynthesis" in window))
return;

speechSynthesis.cancel();

const voice =
new SpeechSynthesisUtterance(
COLORS[color].label
);

voice.rate = 0.85;

voice.pitch = 1;

speechSynthesis.speak(voice);

}


function beep(type="good"){

try{

const AudioCtx =
window.AudioContext ||
window.webkitAudioContext;

const ctx =
new AudioCtx();

const osc =
ctx.createOscillator();

const gain =
ctx.createGain();

osc.connect(gain);

gain.connect(
ctx.destination
);

osc.frequency.value =
type==="good"
? 720
: 220;

gain.gain.value =
0.08;

osc.start();

osc.stop(
ctx.currentTime +
(type==="good"
? 0.15
: 0.22)
);

}catch(e){}

}


function attachDrag(element){

let ghost = null;


function start(event){

event.preventDefault();

const color =
element.dataset.color;

speakColor(color);


const point =
event.touches
? event.touches[0]
: event;


ghost =
element.cloneNode(true);

ghost.classList.add(
"dragging"
);

ghost.style.width =
element.offsetWidth + "px";

ghost.style.height =
element.offsetHeight + "px";

document.body.appendChild(
ghost
);

moveGhost(
point.clientX,
point.clientY
);


function move(ev){

const p =
ev.touches
? ev.touches[0]
: ev;

moveGhost(
p.clientX,
p.clientY
);

}


function end(ev){

const p =
ev.changedTouches
? ev.changedTouches[0]
: ev;

const x = p.clientX;
const y = p.clientY;

ghost.remove();

ghost = null;


const elementBelow =
document.elementFromPoint(
x,
y
);

const slot =
elementBelow
? elementBelow.closest(".slot")
: null;


if(slot){

const index =
Number(
slot.dataset.index
);

answers[index] =
color;

render();

beep("good");

}


window.removeEventListener(
"mousemove",
move
);

window.removeEventListener(
"mouseup",
end
);

window.removeEventListener(
"touchmove",
move
);

window.removeEventListener(
"touchend",
end
);

}


window.addEventListener(
"mousemove",
move,
{passive:false}
);

window.addEventListener(
"mouseup",
end,
{passive:false}
);

window.addEventListener(
"touchmove",
move,
{passive:false}
);

window.addEventListener(
"touchend",
end,
{passive:false}
);

}


element.addEventListener(
"mousedown",
start
);

element.addEventListener(
"touchstart",
start,
{passive:false}
);


function moveGhost(x,y){

if(!ghost)
return;

ghost.style.left =
(x - ghost.offsetWidth/2)
+ "px";

ghost.style.top =
(y - ghost.offsetHeight/2)
+ "px";

}

}


function checkAnswer(){

if(
answers.some(
value=>!value
)
){

statusEl.textContent =
"Fill all the circles first.";

beep("bad");

return;

}


const correct =
answers.every(
(value,index)=>
value ===
targetSequence[index]
);


if(correct){

beep("good");

showScreen(
rewardScreen
);

celebrate();

}

else{

wrongChecks++;

beep("bad");


if(
wrongChecks >= 2
){

showScreen(
tryScreen
);

}

else{

statusEl.textContent =
"Almost! Check the order and try again.";

}

}

}


function celebrate(){

confettiEl.innerHTML = "";

const colors = [
"#ef4444",
"#3b82f6",
"#facc15",
"#22c55e",
"#a855f7",
"#fb7185"
];


for(
let i=0;
i<55;
i++
){

const confetti =
document.createElement(
"span"
);

confetti.style.left =
Math.random()*100
+ "%";

confetti.style.background =
colors[
Math.floor(
Math.random()
*
colors.length
)
];

confetti.style.animationDelay =
Math.random()*0.8
+ "s";

confettiEl.appendChild(
confetti
);

}


setTimeout(()=>{

confettiEl.innerHTML = "";

},3200);

}


document
.getElementById("checkBtn")
.addEventListener(
"click",
checkAnswer
);


document
.getElementById("newBtn")
.addEventListener(
"click",
newChallenge
);


document
.getElementById("resetBtn")
.addEventListener(
"click",
()=>{

answers =
[null,null,null,null];

statusEl.textContent = "";

render();

}
);


document
.getElementById("nextBtn")
.addEventListener(
"click",
newChallenge
);


document
.getElementById("tryBtn")
.addEventListener(
"click",
()=>{

answers =
[null,null,null,null];

wrongChecks = 0;

statusEl.textContent = "";

showScreen(
playScreen
);

render();

}
);


newChallenge();

</script>

</body>
</html>
